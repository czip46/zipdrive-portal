      try {
        // Decode base64 back to original JSX source
        var src = decodeURIComponent(escape(atob(APP_B64)));

        var result = Babel.transform(src, {
          presets: [["react", { runtime: "classic" }]],
          filename: "app.jsx"
        });

        var fn = new Function(
          "React","ReactDOM","useState","useEffect","useRef","useCallback",
          result.code + "\nreturn App;"
        );

        var App = fn(
          React, ReactDOM,
          React.useState, React.useEffect, React.useRef, React.useCallback
        );

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
        document.getElementById("loader").style.display = "none";

      } catch(e) {
        document.getElementById("loader").innerHTML =
          "<div style='color:#EF4444;font-family:sans-serif;padding:24px;font-size:12px;max-width:90vw;word-break:break-word'>" +
          "<b>Error:</b> " + e.message + "</div>";
      }
    });
  </script>
